# sshd du conteneur affut.sh — expose UNIQUEMENT le jeu, jamais un shell.
Port 2222
# clé d'hôte persistante (montée depuis l'hôte) : l'identité SSH du jeu
# survit aux rebuilds de l'image
HostKey /etc/ssh/keys/ssh_host_ed25519_key

# auth par clé uniquement, clés invitées via deploy/invite.sh
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers affut
AuthorizedKeysFile /etc/ssh/auth/%u
StrictModes no

# chaque ligne d'authorized_keys porte environment="AFFUT_PLAYER=pseudo" :
# une sauvegarde par joueur. sans danger ici : seul l'hôte écrit ce fichier,
# et ForceCommand impose notre binaire quoi qu'il arrive.
PermitUserEnvironment yes
ForceCommand /usr/local/bin/affut
PermitTTY yes

# aucun pivot possible
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no

# le TUI a besoin de TERM (passé d'office) ; COLORTERM active le truecolor
AcceptEnv COLORTERM LANG LC_*

# limites de session
ClientAliveInterval 300
ClientAliveCountMax 2
MaxSessions 4
MaxStartups 4:50:8
LoginGraceTime 20
