<title>traque.sh</title>
<style>
  :root {
    --bg: #14181f;
    --text: #c2cdda;
    --dim: #7e8a9b;
    --dimmer: #4a5462;
    --blue: #7ac9ff;
    --gold: #ffc45c;
    --gold-dark: #d6a04b;
    --green: #83d691;
    --red: #ff8585;
    --white: #f8fbff;
    --purple: #c792ea;
    --marsh: #5fb39b;
    --ice: #bfe0ff;
    --abyss: #7a8ab0;
    --seldark: #1a1e26;
    --hlbg: #222832;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); }
  #scr {
    font-family: "Menlo", ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace;
    font-size: 15px; line-height: 19px;
    white-space: pre; font-variant-ligatures: none;
    position: absolute; inset: 0; overflow: hidden;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #meas { position: absolute; visibility: hidden; top: -100px; }
  .fg-text { color: var(--text); }
  .fg-dim { color: var(--dim); }
  .fg-dimmer { color: var(--dimmer); }
  .fg-blue { color: var(--blue); }
  .fg-gold { color: var(--gold); }
  .fg-golddark { color: var(--gold-dark); }
  .fg-green { color: var(--green); }
  .fg-red { color: var(--red); }
  .fg-white { color: var(--white); }
  .fg-purple { color: var(--purple); }
  .fg-marsh { color: var(--marsh); }
  .fg-ice { color: var(--ice); }
  .fg-abyss { color: var(--abyss); }
  .sel { background: var(--gold); color: var(--seldark); }
  .hl { background: var(--hlbg); }
  .act { cursor: pointer; }
  @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
  .blink { animation: blink 1s step-end infinite; color: var(--green); }
  @keyframes shinyp { 0%,100% { color: #7ae8ff; } 50% { color: var(--white); } }
  .shiny { animation: shinyp 1.4s ease-in-out infinite; color: #7ae8ff; }
  @media (prefers-reduced-motion: reduce) { .blink, .shiny { animation: none; } }

  #io {
    display: none; position: absolute; z-index: 10;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(40rem, 90vw);
    background: var(--bg); border: 1px solid var(--dim);
    padding: 1rem; font-family: Menlo, ui-monospace, monospace; font-size: 13px;
  }
  #io.open { display: block; }
  #io textarea {
    width: 100%; min-height: 6rem; background: var(--hlbg); color: var(--text);
    border: 1px solid var(--dimmer); font: inherit; padding: .4rem; resize: vertical;
  }
  #io button {
    font: inherit; background: transparent; color: var(--dim);
    border: 1px solid var(--dimmer); padding: .15rem .6rem; cursor: pointer; margin-top: .5rem;
  }
  #io button:hover { color: var(--gold); border-color: var(--gold-dark); }
  #io .t { color: var(--gold); margin-bottom: .4rem; }
</style>
<div id="scr"></div>
<span id="meas">██████████</span>
<div id="io">
  <div class="t">sauvegarde</div>
  <textarea id="savefield" spellcheck="false" placeholder="collez une sauvegarde ici pour l'importer"></textarea>
  <div>
    <button onclick="doExport()">exporter</button>
    <button onclick="doImport()">importer</button>
    <button onclick="closeIO()">fermer</button>
  </div>
</div>

const SHINY_BASE = 1 / 128;
const SAVE_KEY = 'traquesh_save_v1';

/* =================================================================== état */

function defaultState() {
  return {
    v: 1, ecus: 30,
    totalEarned: 0, runEarned: 0,
    captures: 0, shinies: 0, attempts: 0,
    trophies: 0, migrations: 0,
    traps: { bois: 1 }, baits: {},
    biomes: { foret: { slots: 2, pl: [null, null] } },
    inv: {}, dex: {}, lab: {}, autosell: {}, ach: {},
    lastSeen: Date.now(), created: Date.now(),
  };
}
let S = defaultState();

function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' Md';
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' M';
  if (n >= 10000) return (n / 1e3).toFixed(1).replace(',0', '').replace('.', ',') + ' k';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* ------------------------------------------------------------ calcul bonus */

function completedBiomes() { return BORDER.filter(b => CBIOME[b].every(c => S.dex[c.id])).length; }
function shinyCompletedBiomes() { return BORDER.filter(b => CBIOME[b].every(c => S.dex[c.id] && S.dex[c.id].s > 0)).length; }
function globalLuck() { return (S.lab.flair || 0) * .06 + S.trophies * .04 + completedBiomes() * .10; }
function sellMult() { return (1 + (S.lab.negoce || 0) * .08) * (1 + S.trophies * .04) * (1 + shinyCompletedBiomes() * .10); }
function speedMult() { return 1 + (S.lab.affutage || 0) * .06; }
function shinyChance(bait) {
  let c = SHINY_BASE * (1 + (S.lab.eclat || 0) * .15);
  if (bait === 'essence') c *= 4;
  return Math.min(c, .25);
}
function offlineCapMs() { return (2 + (S.lab.horloge || 0) * 2) * 3600 * 1000; }
function trapInterval(tier, bait) {
  let itv = TRAPS[tier].itv / speedMult();
  if (bait === 'baies') itv *= 0.8;
  return itv * 1000;
}
function creatureValue(c, shiny) {
  let v = RARITIES[c.r].val * BIOMES[c.b].mult * sellMult();
  if (shiny) v *= 15;
  return Math.max(1, Math.floor(v));
}
function labCost(key) { return Math.floor(LABS[key].base * Math.pow(LABS[key].mult, S.lab[key] || 0)); }
function slotCost(b) {
  const base = Math.max(250, BIOMES[b].cost);
  return S.biomes[b].slots === 2 ? Math.floor(base * .5) : Math.floor(base * 2);
}
function placedCount(tier) {
  let n = 0;
  for (const b in S.biomes) S.biomes[b].pl.forEach(p => { if (p && p.trap === tier) n++; });
  return n;
}
function trophyGain() { return Math.floor(Math.sqrt(S.runEarned / 25000)); }

/* ---------------------------------------------------------------- capture */

function rollCreature(biome, luck, bait) {
  const pool = CBIOME[biome];
  const weights = pool.map(c => {
    const i = RORDER.indexOf(c.r);
    let w = RARITIES[c.r].w * Math.pow(1 + luck, i);
    if (bait === 'truffe' && i >= 2) w *= 2.5;
    return w;
  });
  const total = weights.reduce((a, x) => a + x, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function attempt(biome, pl, silent) {
  const trap = TRAPS[pl.trap];
  let bait = null;
  if (pl.bait && (S.baits[pl.bait] || 0) > 0) {
    bait = pl.bait;
    S.baits[bait]--;
    if (S.baits[bait] <= 0) {
      delete S.baits[bait];
      if (!silent) log([['appât épuisé (' + BAITS[bait].n + ') · ' + BIOMES[biome].name, 'fg-dim']]);
    }
  }
  S.attempts++;
  if (Math.random() > trap.succ) return null;

  let luck = trap.luck + globalLuck();
  if (bait === 'viande') luck += .35;
  if (bait === 'nectar') luck += .2;
  if (bait === 'essence') luck += .3;

  const c = rollCreature(biome, luck, bait);
  const shiny = Math.random() < shinyChance(bait);
  const isNew = !S.dex[c.id];
  const newShiny = shiny && (!S.dex[c.id] || S.dex[c.id].s === 0);

  if (!S.dex[c.id]) S.dex[c.id] = { n: 0, s: 0 };
  S.dex[c.id].n++;
  if (shiny) S.dex[c.id].s++;
  if (!S.inv[c.id]) S.inv[c.id] = { n: 0, s: 0 };
  if (shiny) S.inv[c.id].s++; else S.inv[c.id].n++;
  S.captures++;
  if (shiny) S.shinies++;

  let sold = 0;
  if ((S.lab.autovente || 0) >= 1 && S.autosell[c.r] && !shiny && S.inv[c.id].n > 1) {
    const q = S.inv[c.id].n - 1;
    S.inv[c.id].n = 1;
    sold = Math.floor(q * creatureValue(c, false) * (bait === 'nectar' ? 1.5 : 1));
    gain(sold);
  }
  return { c, shiny, isNew, newShiny, bait, sold };
}

function gain(n) { S.ecus += n; S.totalEarned += n; S.runEarned += n; }

function reportCatch(biome, res) {
  if (!res) return;
  const { c, shiny, isNew, newShiny, sold } = res;
  const segs = [
    [BIOMES[biome].name + ' → ', 'fg-dim'],
    [c.n + (shiny ? ' ✦' : ''), shiny ? 'shiny' : RARITIES[c.r].cls],
    [' (' + RARITIES[c.r].label + (shiny ? ' · shiny' : '') + ')', 'fg-dimmer'],
  ];
  if (sold) segs.push([' · auto-vente +' + fmt(sold) + ' écus', 'fg-golddark']);
  log(segs);
  if (isNew) {
    log([['nouvelle espèce découverte : ', 'fg-green'], [c.n, RARITIES[c.r].cls], [' !', 'fg-green']]);
    toast('nouvelle espèce : ' + c.n);
  }
  if (newShiny && !isNew) toast('shiny obtenu : ' + c.n + ' ✦');
  if (c.r === 'legendaire') toast('légendaire capturé : ' + c.n);
}

/* --------------------------------------------------------------- boucle */

function tick() {
  const now = Date.now();
  for (const b in S.biomes) {
    S.biomes[b].pl.forEach(pl => {
      if (!pl) return;
      let guard = 0;
      while (pl.nextAt <= now && guard++ < 50) {
        reportCatch(b, attempt(b, pl, false));
        pl.nextAt += trapInterval(pl.trap, pl.bait && S.baits[pl.bait] ? pl.bait : null);
      }
    });
  }
  checkAchievements();
  S.lastSeen = now;
}

function runOffline() {
  const now = Date.now();
  const away = now - S.lastSeen;
  if (away < 15000) { resetTimers(now); return; }
  const capped = Math.min(away, offlineCapMs());
  const from = now - capped;
  let caught = 0, earned0 = S.totalEarned, discoveries = [], shinies0 = S.shinies;
  for (const b in S.biomes) {
    S.biomes[b].pl.forEach(pl => {
      if (!pl) return;
      let t = Math.max(pl.nextAt, from);
      let guard = 0;
      while (t <= now && guard++ < 4000) {
        const res = attempt(b, pl, true);
        if (res) { caught++; if (res.isNew) discoveries.push(res.c); }
        t += trapInterval(pl.trap, pl.bait && S.baits[pl.bait] ? pl.bait : null);
      }
      pl.nextAt = t;
    });
  }
  checkAchievements();
  if (caught > 0) {
    const earned = S.totalEarned - earned0, newShinies = S.shinies - shinies0;
    const h = Math.floor(capped / 3600000), m = Math.floor((capped % 3600000) / 60000);
    openPanel(offlinePanel(h, m, away > offlineCapMs(), caught, newShinies, earned, discoveries));
    log([['retour de ' + (h ? h + ' h ' : '') + m + ' min hors-ligne : ' + fmt(caught) + ' captures', 'fg-green']]);
  }
  resetTimers(now);
}
function resetTimers(now) {
  for (const b in S.biomes) S.biomes[b].pl.forEach(pl => {
    if (pl && (pl.nextAt < now || pl.nextAt > now + 120000)) pl.nextAt = now + trapInterval(pl.trap, pl.bait);
  });
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!S.ach[a.id] && a.t(S)) {
      S.ach[a.id] = true;
      if (a.r) gain(a.r);
      log([['succès débloqué : ', 'fg-green'], [a.n, 'fg-gold'], [a.r ? ' (+' + fmt(a.r) + ' écus)' : '', 'fg-dimmer']]);
      toast('succès : ' + a.n);
    }
  });
}

/* -------------------------------------------------------------- actions */

function buyTrap(tier) {
  const t = TRAPS[tier];
  if (S.ecus < t.cost) return;
  S.ecus -= t.cost;
  S.traps[tier] = (S.traps[tier] || 0) + 1;
  log([['acheté : ' + t.n, 'fg-text'], [' (−' + fmt(t.cost) + ' écus)', 'fg-dimmer']]);
}
function buyBait(id, q) {
  const cost = BAITS[id].cost * q;
  if (S.ecus < cost) return;
  S.ecus -= cost;
  S.baits[id] = (S.baits[id] || 0) + q;
  log([['acheté : ' + q + '× ' + BAITS[id].n, 'fg-text'], [' (−' + fmt(cost) + ' écus)', 'fg-dimmer']]);
}
function buyLab(key) {
  const cost = labCost(key), lv = S.lab[key] || 0;
  if (lv >= LABS[key].max || S.ecus < cost) return;
  S.ecus -= cost;
  S.lab[key] = lv + 1;
  log([['labo : ' + LABS[key].n + ' niveau ' + (lv + 1), 'fg-blue'], [' (−' + fmt(cost) + ' écus)', 'fg-dimmer']]);
}
function unlockBiome(b) {
  const cost = BIOMES[b].cost;
  if (S.biomes[b] || S.ecus < cost) return;
  S.ecus -= cost;
  S.biomes[b] = { slots: 2, pl: [null, null] };
  log([['biome débloqué : ' + BIOMES[b].name, 'fg-green']]);
  toast('biome débloqué : ' + BIOMES[b].name);
  checkAchievements();
}
function buySlot(b) {
  const cost = slotCost(b);
  if (S.biomes[b].slots >= 4 || S.ecus < cost) return;
  S.ecus -= cost;
  S.biomes[b].slots++;
  S.biomes[b].pl.push(null);
  log([['emplacement supplémentaire : ' + BIOMES[b].name, 'fg-text'], [' (−' + fmt(cost) + ' écus)', 'fg-dimmer']]);
}
function placeTrap(b, i, tier) {
  S.biomes[b].pl[i] = { trap: tier, bait: null, nextAt: Date.now() + trapInterval(tier, null) };
  log([['piège posé : ' + TRAPS[tier].n + ' → ' + BIOMES[b].name, 'fg-text']]);
}
function sellCreature(id, shiny, qty) {
  const c = CBY[id], iv = S.inv[id];
  if (!iv) return;
  let q;
  if (shiny) q = qty === 'all' ? iv.s : Math.min(qty, iv.s);
  else q = qty === 'all' ? iv.n : (qty === 'keep1' ? Math.max(0, iv.n - 1) : Math.min(qty, iv.n));
  if (q <= 0) return;
  const v = creatureValue(c, shiny) * q;
  if (shiny) iv.s -= q; else iv.n -= q;
  if (iv.n <= 0 && iv.s <= 0) delete S.inv[id];
  gain(v);
  log([['vendu : ' + q + '× ' + c.n + (shiny ? ' ✦' : ''), 'fg-text'], [' (+' + fmt(v) + ' écus)', 'fg-golddark']]);
}
function sellDupes() {
  let total = 0, n = 0;
  for (const id in S.inv) {
    const iv = S.inv[id], q = Math.max(0, iv.n - 1);
    if (q > 0) { total += creatureValue(CBY[id], false) * q; iv.n -= q; n += q; }
  }
  if (n === 0) return;
  gain(total);
  log([['vendu : ' + fmt(n) + ' doublons', 'fg-text'], [' (+' + fmt(total) + ' écus)', 'fg-golddark']]);
}
function doMigration() {
  const g = trophyGain();
  if (g < 1) return;
  S.trophies += g;
  S.migrations++;
  S.ecus = 30;
  S.runEarned = 0;
  S.traps = { bois: 1 };
  S.baits = {}; S.inv = {}; S.lab = {}; S.autosell = {};
  S.biomes = { foret: { slots: 2, pl: [null, null] } };
  log([['migration effectuée : +' + g + ' trophées. tout recommence, en mieux.', 'fg-gold']]);
  toast('migration : +' + g + ' trophées');
  checkAchievements();
  save();
}

function save() {
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) S = Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { S = defaultState(); }
}

/* =========================================================== monde ASCII */

const MAPW = 114, MAPH = 46;
let W = [];          // cellules {ch, cls, solid}
const DOORS = [];    // {x, y, id}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function wput(x, y, ch, cls, solid) {
  if (x < 0 || y < 0 || x >= MAPW || y >= MAPH) return;
  W[y][x] = { ch, cls, solid: !!solid };
}
function wtext(x, y, str, cls, solid) {
  for (let i = 0; i < str.length; i++) wput(x + i, y, str[i], cls, solid);
}
function scatter(x, y, w, h, glyphs, cls, density, solid, rng) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) {
    if (W[yy] && W[yy][xx] && W[yy][xx].ch === ' ' && rng() < density) {
      wput(xx, yy, glyphs[Math.floor(rng() * glyphs.length)], cls, solid);
    }
  }
}
function building(x, y, w, h, label, doorId, doorGlyph) {
  for (let xx = x; xx < x + w; xx++) { wput(xx, y, '═', 'fg-dim', true); wput(xx, y + h - 1, '═', 'fg-dim', true); }
  for (let yy = y; yy < y + h; yy++) { wput(x, yy, '║', 'fg-dim', true); wput(x + w - 1, yy, '║', 'fg-dim', true); }
  wput(x, y, '╔', 'fg-dim', true); wput(x + w - 1, y, '╗', 'fg-dim', true);
  wput(x, y + h - 1, '╚', 'fg-dim', true); wput(x + w - 1, y + h - 1, '╝', 'fg-dim', true);
  for (let yy = y + 1; yy < y + h - 1; yy++) for (let xx = x + 1; xx < x + w - 1; xx++) wput(xx, yy, '▒', 'fg-dimmer', true);
  wtext(x + Math.floor((w - label.length) / 2), y + Math.floor(h / 2), label, 'fg-gold', true);
  const dx = x + Math.floor(w / 2);
  wtext(dx - 2, y + h - 1, '╡ ' + doorGlyph + ' ╞', 'fg-gold', false);
  wput(dx, y + h - 1, doorGlyph, 'fg-gold', false);
  DOORS.push({ x: dx, y: y + h - 1, id: doorId });
  DOORS.push({ x: dx, y: y + h, id: doorId });
}

const ZONES = [
  { id: 'foret',    x: 1,  y: 2,  w: 33, h: 18 },
  { id: 'montagne', x: 37, y: 1,  w: 39, h: 9 },
  { id: 'glacier',  x: 79, y: 1,  w: 34, h: 11 },

  { id: 'desert',   x: 79, y: 15, w: 34, h: 13 },
  { id: 'abysses',  x: 79, y: 31, w: 34, h: 14 },
];
const LABELPOS = {
  foret:    { x: 12, y: 3 },
  montagne: { x: 50, y: 2 },
  glacier:  { x: 90, y: 2 },
  marais:   { x: 12, y: 25 },

};

function buildWorld() {
  W = [];
  for (let y = 0; y < MAPH; y++) {
    W.push([]);
    for (let x = 0; x < MAPW; x++) W[y].push({ ch: ' ', cls: 'fg-dimmer', solid: false });
  }
  const rng = mulberry32(1337);

  // village : sol
  for (let y = 12; y <= 33; y++) for (let x = 37; x <= 76; x++)
    if (rng() < .5) wput(x, y, '░', 'fg-dimmer', false);
  // chemins vers les biomes
  const path = (x1, y1, x2, y2) => {
    let x = x1, y = y1;
    while (x !== x2) { wput(x, y, '░', 'fg-dimmer', false); x += Math.sign(x2 - x); }
    while (y !== y2) { wput(x, y, '░', 'fg-dimmer', false); y += Math.sign(y2 - y); }
  };
  path(37, 22, 20, 12);  // forêt
  path(37, 28, 20, 34);  // marais
  path(56, 12, 56, 6);   // montagne
  path(76, 20, 95, 6);   // glacier
  path(76, 24, 95, 21);  // désert
  path(76, 30, 95, 37);  // abysses
  // grand corridor du village : traversée est-ouest garantie
  for (let x = 37; x <= 76; x++) wput(x, 22, '░', 'fg-dimmer', false);

  // biomes : décor
  scatter(1, 2, 33, 18, ['♣', '♣', '♠', '.'], 'fg-green', .16, true, rng);
  scatter(37, 1, 39, 9, ['^', '▲', '/\\'[0], '∆'], 'fg-dim', .13, true, rng);
  scatter(79, 1, 34, 11, ['*', '▲', '·'], 'fg-ice', .12, true, rng);
  scatter(1, 24, 33, 21, ['~', '~', 'o', '"'], 'fg-marsh', .14, false, rng);
  scatter(79, 15, 34, 13, ['∙', '≈', '·'], 'fg-golddark', .12, false, rng);
  scatter(79, 31, 34, 14, ['▓', '▒', '●', '·'], 'fg-abyss', .13, true, rng);

  // plantes du village (avant les bâtiments, pour ne pas pousser dans les portes)
  scatter(37, 12, 40, 22, ['♣'], 'fg-green', .012, false, rng);

  // bâtiments du village
  building(39, 14, 16, 6, 'boutique', 'boutique', 'o');
  building(59, 14, 16, 6, 'labo', 'labo', 'l');
  building(43, 25, 13, 5, 'bestiaire', 'bestiaire', 'b');
  building(61, 25, 13, 5, 'trophées', 'succes', 't');

  // fontaine décorative
  wtext(55, 23, '╭─╮', 'fg-blue', true);
  wtext(55, 24, '╰─╯', 'fg-blue', true);
}

/* ============================================================== renderer */

const scr = document.getElementById('scr');
let COLS = 80, ROWS = 24, CW = 9, CH = 19;
let buf = [];        // [{ch, cls, act}]
let actions = [];

function measure() {
  const m = document.getElementById('meas');
  CW = m.getBoundingClientRect().width / 10;
  CH = 19;
  COLS = Math.max(60, Math.floor(window.innerWidth / CW));
  ROWS = Math.max(22, Math.floor(window.innerHeight / CH));
}
function clearBuf() {
  buf = [];
  actions = [];
  for (let y = 0; y < ROWS; y++) {
    buf.push([]);
    for (let x = 0; x < COLS; x++) buf[y].push({ ch: ' ', cls: 'fg-text', act: -1 });
  }
}
function put(x, y, str, cls, act) {
  if (y < 0 || y >= ROWS) return;
  let ai = -1;
  if (act) { ai = actions.length; actions.push(act); }
  for (let i = 0; i < str.length; i++) {
    const xx = x + i;
    if (xx < 0 || xx >= COLS) continue;
    buf[y][xx] = { ch: str[i], cls, act: ai };
  }
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function flush() {
  let html = '';
  for (let y = 0; y < ROWS; y++) {
    let runCls = null, runAct = -2, run = '';
    for (let x = 0; x < COLS; x++) {
      const c = buf[y][x];
      if (c.cls !== runCls || c.act !== runAct) {
        if (run) html += '<span class="' + runCls + (runAct >= 0 ? ' act' : '') + '"' + (runAct >= 0 ? ' data-a="' + runAct + '"' : '') + '>' + esc(run) + '</span>';
        runCls = c.cls; runAct = c.act; run = '';
      }
      run += c.ch;
    }
    if (run) html += '<span class="' + runCls + (runAct >= 0 ? ' act' : '') + '"' + (runAct >= 0 ? ' data-a="' + runAct + '"' : '') + '>' + esc(run) + '</span>';
    html += '\n';
  }
  scr.innerHTML = html;
}
scr.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (t) { const fn = actions[+t.dataset.a]; if (fn) { fn(); render(); } }
});

let logLines = [];   // {t, segs}
function log(segs) {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
  logLines.unshift({ t, segs });
  if (logLines.length > 80) logLines.length = 80;
}

let toasts = [];     // {msg, until}
function toast(msg) { toasts.push({ msg, until: Date.now() + 3800 }); if (toasts.length > 4) toasts.shift(); }

/* =============================================================== joueur */

const P = { x: 50, y: 22 };
function solidAt(x, y) {
  if (x < 0 || y < 0 || x >= MAPW || y >= MAPH) return true;
  return W[y][x].solid;
}
function movePlayer(dx, dy) {
  const nx = P.x + dx, ny = P.y + dy;
  if (!solidAt(nx, ny)) { P.x = nx; P.y = ny; }
}
function zoneAt(x, y) {
  const d = DOORS.find(d => Math.abs(d.x - x) <= 1 && Math.abs(d.y - y) <= 1);
  if (d) return d.id;
  const z = ZONES.find(z => x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h);
  return z ? z.id : null;
}
function zoneHint() {
  const z = zoneAt(P.x, P.y);
  if (!z) return { txt: 'promenez-vous · Entrée pour interagir près d\'un lieu', cls: 'fg-dimmer' };
  if (BIOMES[z]) {
    if (!S.biomes[z]) return { txt: BIOMES[z].name + ' · verrouillé — Entrée : débloquer pour ' + fmt(BIOMES[z].cost) + ' écus', cls: 'fg-red' };
    const placed = S.biomes[z].pl.filter(Boolean).length;
    return { txt: BIOMES[z].name + ' · ' + placed + '/' + S.biomes[z].slots + ' pièges posés — Entrée : gérer', cls: 'fg-green' };
  }
  const names = { boutique: 'boutique — Entrée : acheter et vendre', labo: 'labo — Entrée : recherches et migration', bestiaire: 'bestiaire — Entrée : consulter', succes: 'trophées — Entrée : succès' };
  return { txt: names[z] || z, cls: 'fg-gold' };
}
function interact() {
  const z = zoneAt(P.x, P.y);
  if (!z) return;
  if (BIOMES[z]) {
    if (!S.biomes[z]) openPanel(unlockPanel(z));
    else openPanel(biomePanel(z));
  }
  else if (z === 'boutique') openPanel(shopPanel());
  else if (z === 'labo') openPanel(labPanel());
  else if (z === 'bestiaire') openPanel(dexPanel());
  else if (z === 'succes') openPanel(achPanel());
}

/* ============================================================== panneaux */

/* un panneau : { title, build() -> rows, sel, scroll }
   row : { segs:[[txt,cls]...], btns:[{label, fn, cls}], act, indent } */
let panels = [];
function openPanel(p) { p.sel = 0; p.scroll = 0; panels.push(p); }
function closePanel() { panels.pop(); }
function closeAll() { panels = []; }
function topPanel() { return panels[panels.length - 1] || null; }

function wrap(txt, w) {
  const words = txt.split(' '), lines = [];
  let cur = '';
  words.forEach(word => {
    if ((cur + ' ' + word).trim().length > w) { lines.push(cur.trim()); cur = word; }
    else cur += ' ' + word;
  });
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}
function trow(txt, cls) { return { segs: [[txt, cls || 'fg-dim']] }; }
function wrows(txt, w, cls) { return wrap(txt, w).map(l => trow(l, cls)); }
function hrow(txt) { return { segs: [['── ' + txt + ' ', 'fg-blue'], ['─'.repeat(40), 'fg-dimmer']] }; }

function selectables(rows) {
  const out = [];
  rows.forEach((r, i) => {
    if (r.act) out.push({ r: i, b: -1 });
    (r.btns || []).forEach((_, j) => out.push({ r: i, b: j }));
  });
  return out;
}

function drawPanel(p) {
  const rows = p.build();
  const pw = Math.min(80, COLS - 6);
  const ph = Math.min(ROWS - 6, rows.length + 4);
  const px = Math.floor((COLS - pw) / 2), py = Math.floor((ROWS - ph) / 2);
  const inner = ph - 4;

  const sels = selectables(rows);
  if (p.sel >= sels.length) p.sel = Math.max(0, sels.length - 1);
  const cur = sels[p.sel] || null;

  if (cur) {
    if (cur.r < p.scroll) p.scroll = cur.r;
    if (cur.r >= p.scroll + inner) p.scroll = cur.r - inner + 1;
  }
  p.scroll = Math.max(0, Math.min(p.scroll, Math.max(0, rows.length - inner)));

  // fond
  for (let y = py; y < py + ph; y++) put(px, y, ' '.repeat(pw), 'hl');
  // cadre
  put(px, py, '┌' + '─'.repeat(pw - 2) + '┐', 'fg-dim hl');
  put(px, py + ph - 1, '└' + '─'.repeat(pw - 2) + '┘', 'fg-dim hl');
  for (let y = py + 1; y < py + ph - 1; y++) { put(px, y, '│', 'fg-dim hl'); put(px + pw - 1, y, '│', 'fg-dim hl'); }
  put(px + 2, py, ' ' + p.title + ' ', 'fg-gold hl');
  if (rows.length > inner) {
    put(px + pw - 14, py + ph - 1, ' ' + (p.scroll + 1) + '-' + Math.min(rows.length, p.scroll + inner) + '/' + rows.length + ' ', 'fg-dimmer hl');
  }
  put(px + 2, py + ph - 1, ' ↑↓ naviguer · Entrée valider · Échap fermer ', 'fg-dimmer hl');

  for (let i = 0; i < inner; i++) {
    const ri = p.scroll + i;
    if (ri >= rows.length) break;
    const r = rows[ri];
    let x = px + 2 + (r.indent || 0);
    const y = py + 2 + i;
    const rowSel = cur && cur.r === ri && cur.b === -1;
    (r.segs || []).forEach(([txt, cls]) => {
      put(x, y, txt, (rowSel ? 'sel' : (cls + ' hl')), r.act ? (() => { p.sel = sels.findIndex(s => s.r === ri && s.b === -1); r.act(); }) : null);
      x += txt.length;
    });
    (r.btns || []).forEach((btn, j) => {
      x += 1;
      const isSel = cur && cur.r === ri && cur.b === j;
      const lbl = '[' + btn.label + ']';
      put(x, y, lbl, isSel ? 'sel' : ((btn.cls || 'fg-blue') + ' hl'),
        () => { p.sel = sels.findIndex(s => s.r === ri && s.b === j); btn.fn(); });
      x += lbl.length;
    });
  }
}

function panelKey(p, e) {
  const rows = p.build();
  const sels = selectables(rows);
  const k = e.key;
  if (k === 'Escape' || k === 'q') { closePanel(); return; }
  if (!sels.length) return;
  if (k === 'ArrowDown' || k === 'j' || k === 's') {
    const r0 = sels[p.sel] ? sels[p.sel].r : 0;
    let n = p.sel;
    for (let i = p.sel + 1; i < sels.length; i++) if (sels[i].r > r0) { n = i; break; }
    p.sel = n;
  } else if (k === 'ArrowUp' || k === 'k' || k === 'z') {
    const r0 = sels[p.sel] ? sels[p.sel].r : 0;
    let n = p.sel;
    for (let i = p.sel - 1; i >= 0; i--) if (sels[i].r < r0) { n = i; break; }
    if (n !== p.sel) {
      const rTarget = sels[n].r;
      while (n > 0 && sels[n - 1].r === rTarget) n--;
    }
    p.sel = n;
  } else if (k === 'ArrowRight' || k === 'l' || k === 'd') {
    if (p.sel + 1 < sels.length && sels[p.sel + 1].r === sels[p.sel].r) p.sel++;
  } else if (k === 'ArrowLeft' || k === 'h') {
    if (p.sel > 0 && sels[p.sel - 1].r === sels[p.sel].r) p.sel--;
  } else if (k === 'Enter' || k === ' ') {
    const s = sels[p.sel];
    if (!s) return;
    const r = rows[s.r];
    if (s.b === -1 && r.act) r.act();
    else if (r.btns && r.btns[s.b]) r.btns[s.b].fn();
  }
}

  };
}

function journalPanel() {
  return {
    title: 'journal',
    build() {
      if (!logLines.length) return [trow('rien à signaler pour l\'instant.', 'fg-dimmer')];
      return logLines.map(l => ({ segs: [['[' + l.t + '] ', 'fg-dimmer']].concat(l.segs) }));
    },
  };
}

function offlinePanel(h, m, hitCap, caught, newShinies, earned, discoveries) {
  return {
    title: 'pendant votre absence',
    build() {
      const rows = [];
      rows.push(trow('vos pièges ont travaillé ' + (h ? h + ' h ' : '') + m + ' min' + (hitCap ? ' (plafond atteint — voir horlogerie au labo)' : ''), 'fg-dim'));
      rows.push(trow(''));
      rows.push(trow('├─ captures : ' + fmt(caught), 'fg-green'));
      if (newShinies) rows.push(trow('├─ shinies : ' + newShinies + ' ✦', 'fg-blue'));
      if (earned) rows.push(trow('├─ auto-vente : +' + fmt(earned) + ' écus', 'fg-golddark'));
      rows.push({
        segs: [['└─ nouvelles espèces : ', 'fg-text']].concat(
          discoveries.length
            ? discoveries.slice(0, 6).flatMap((c, i) => [[c.n, RARITIES[c.r].cls], [i < Math.min(discoveries.length, 6) - 1 ? ', ' : (discoveries.length > 6 ? '…' : ''), 'fg-dim']])
            : [[ 'aucune', 'fg-dimmer' ]]),
      });
      rows.push(trow(''));
      rows.push({ segs: [['', 'fg-dim']], btns: [{ label: 'reprendre la traque', fn: closePanel, cls: 'fg-green' }] });
      return rows;
    },
  };
}

/* ============================================================ rendu écran */

function render() {
  clearBuf();
  const now = Date.now();

  // ---- monde (viewport) ----
  const vy0 = 1, vy1 = ROWS - 6;               // lignes écran du monde
  const vh = vy1 - vy0 + 1, vw = COLS - 2;
  let camX = Math.round(P.x - vw / 2), camY = Math.round(P.y - vh / 2);
  camX = Math.max(0, Math.min(camX, Math.max(0, MAPW - vw)));
  camY = Math.max(0, Math.min(camY, Math.max(0, MAPH - vh)));
  const offX = vw > MAPW ? Math.floor((vw - MAPW) / 2) : 0;
  const offY = vh > MAPH ? Math.floor((vh - MAPH) / 2) : 0;

  for (let sy = 0; sy < vh; sy++) {
    const wy = camY + sy - offY;
    if (wy < 0 || wy >= MAPH) continue;
    for (let sx = 0; sx < vw; sx++) {
      const wx = camX + sx - offX;
      if (wx < 0 || wx >= MAPW) continue;
      const cell = W[wy][wx];
      if (cell.ch !== ' ') buf[vy0 + sy][1 + sx] = { ch: cell.ch, cls: cell.cls, act: -1 };
    }
  }
  // étiquettes de biomes (dynamiques : état verrouillé)
  BORDER.forEach(b => {
    const lp = LABELPOS[b];
    const sx = 1 + lp.x - camX + offX, sy = vy0 + lp.y - camY + offY;
    if (sy < vy0 || sy > vy1) return;
    const owned = !!S.biomes[b];
    const lbl = owned ? '╡ ' + BIOMES[b].name + ' ╞' : '╡ ' + BIOMES[b].name + ' × ╞';
    const cls = owned ? 'fg-white' : 'fg-red';
    put(sx, sy, lbl, cls, () => { if (owned) openPanel(biomePanel(b)); else openPanel(unlockPanel(b)); });
    if (owned) {
      const placed = S.biomes[b].pl.filter(Boolean).length;
      if (placed) put(sx + 1, sy + 1, placed + ' piège' + (placed > 1 ? 's' : ''), 'fg-golddark');
    }
  });
  // joueur
  const psx = 1 + P.x - camX + offX, psy = vy0 + P.y - camY + offY;
  put(psx - 1, psy, '(_)', 'fg-white');
  put(psx, psy - 1, 'o', 'fg-white');

  // ---- séparateur + contexte ----
  const hint = zoneHint();
  const sepY = ROWS - 5;
  put(0, sepY, '├' + '─'.repeat(COLS - 2) + '┤', 'fg-dimmer');
  put(3, sepY, ' ' + hint.txt + ' ', hint.cls);

  // ---- journal (3 lignes) ----
  for (let i = 0; i < 3; i++) {
    const l = logLines[i];
    const y = ROWS - 4 + i;
    if (!l) continue;
    let x = 2;
    put(x, y, '[' + l.t + '] ', 'fg-dimmer'); x += 11;
    l.segs.forEach(([txt, cls]) => {
      if (x >= COLS - 2) return;
      const t = txt.slice(0, COLS - 2 - x);
      put(x, y, t, cls); x += t.length;
    });
  }

  // ---- cadre ----
  put(0, 0, '┌' + '─'.repeat(COLS - 2) + '┐', 'fg-dim');
  put(0, ROWS - 1, '└' + '─'.repeat(COLS - 2) + '┘', 'fg-dim');
  for (let y = 1; y < ROWS - 1; y++) { if (y !== sepY) { put(0, y, '│', 'fg-dim'); put(COLS - 1, y, '│', 'fg-dim'); } }

  // titre + stats dans la bordure haute
  let tx = 2;
  put(tx, 0, ' traque.sh ', 'fg-green'); tx += 11;
  put(tx, 0, '▌', 'blink'); tx += 1;
  const dex = Object.keys(S.dex).length;
  const stats = [
    [' ' + fmt(S.ecus) + ' écus ', 'fg-gold'],
    ['· ' + fmt(S.captures) + ' captures ', 'fg-dim'],
    ['· bestiaire ' + Math.round(dex / 60 * 100) + '% ', 'fg-blue'],
  ];
  if (S.trophies) stats.push(['· ' + S.trophies + ' trophées ', 'fg-golddark']);
  stats.forEach(([txt, cls]) => { put(tx, 0, txt, cls); tx += txt.length; });

  // raccourcis dans la bordure basse
  const kb = ' ←↑↓→/zqsd se déplacer · Entrée interagir · [b]estiaire [o] boutique [l]abo [t]rophées [j]ournal [?] aide ';
  put(2, ROWS - 1, kb.slice(0, COLS - 4), 'fg-dimmer');

  // ---- toasts ----
  toasts = toasts.filter(t => t.until > now);
  toasts.forEach((t, i) => {
    const wdt = Math.min(t.msg.length + 4, COLS - 4);
    const x = COLS - wdt - 2, y = 2 + i * 3;
    put(x, y, '┌' + '─'.repeat(wdt - 2) + '┐', 'fg-green');
    put(x, y + 1, '│ ' + t.msg.slice(0, wdt - 4).padEnd(wdt - 4) + ' │', 'fg-green');
    put(x, y + 2, '└' + '─'.repeat(wdt - 2) + '┘', 'fg-green');
  });

  // ---- panneau actif ----
  const p = topPanel();
  if (p) drawPanel(p);

  flush();
}

/* ================================================================ entrées */

const io = document.getElementById('io');
function openIO() { io.classList.add('open'); }
window.closeIO = function () { io.classList.remove('open'); };
window.doExport = function () {
  const data = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  document.getElementById('savefield').value = data;
  document.getElementById('savefield').select();
  try { navigator.clipboard.writeText(data); toast('sauvegarde copiée'); } catch (e) { /* sélectionnée pour copie manuelle */ }
};
window.doImport = function () {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('savefield').value.trim()))));
    if (!data || typeof data.ecus !== 'number' || !data.biomes) throw new Error('bad');
    S = Object.assign(defaultState(), data);
    S.lastSeen = Date.now();
    resetTimers(Date.now());
    save();
    toast('sauvegarde importée');
    closeIO();
  } catch (e) { toast('sauvegarde illisible'); }
};

document.addEventListener('keydown', e => {
  if (io.classList.contains('open')) {
    if (e.key === 'Escape') closeIO();
    return;
  }
  const p = topPanel();
  if (p) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(e.key)) e.preventDefault();
    panelKey(p, e);
    render();
    return;
  }
  const k = e.key;
  let moved = true;
  if (k === 'ArrowUp' || k === 'z' || k === 'w') movePlayer(0, -1);
  else if (k === 'ArrowDown' || k === 's') movePlayer(0, 1);
  else if (k === 'ArrowLeft' || k === 'q' || k === 'a') movePlayer(-1, 0);
  else if (k === 'ArrowRight' || k === 'd') movePlayer(1, 0);
  else moved = false;
  if (moved) { e.preventDefault(); render(); return; }

  if (k === 'Enter' || k === ' ') { e.preventDefault(); interact(); }
  else if (k === 'b') openPanel(dexPanel());
  else if (k === 'o') openPanel(shopPanel());
  else if (k === 'l') openPanel(labPanel());
  else if (k === 't') openPanel(achPanel());
  else if (k === 'j') openPanel(journalPanel());
  else if (k === '?' || k === '/') openPanel(helpPanel());
  else if (k === 'Escape') closeAll();
  render();
});

window.addEventListener('resize', () => { measure(); render(); });

/* ================================================================== init */

buildWorld();
load();
measure();
runOffline();
log([['bienvenue. un piège en bois vous attend en réserve — la forêt est à l\'ouest.', 'fg-green']]);
render();
setInterval(() => { tick(); render(); }, 500);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
</script>
