<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>affut.sh — un comptoir de capture pour gens patients</title>
<meta name="description" content="Jeu idle de capture et de collection, façon terminal. Posez des pièges, complétez le bestiaire, laissez le temps travailler — même onglet fermé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Iosevka : tracés et trames pixel-perfect, comme un vrai terminal */
  @font-face {
    font-family: "Iosevka Affut";
    src: url("./fonts/iosevka-affut-300.woff2") format("woff2");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #101318; color: #c2cdda;
    font-family: "Iosevka Affut", "JetBrains Mono", "Menlo", ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeSpeed;
    display: flex; align-items: center; justify-content: center;
  }
  #scr {
    white-space: pre; letter-spacing: 0.5px;
    overflow: hidden;
    background: #171c24; /* fond plein sur toute la grille, carte comprise */
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  /* chaque ligne est un bloc de hauteur fixe ; les segments colorés remplissent
     toute la cellule — plus de bandes entre les lignes, comme un vrai terminal */
  #scr div { height: var(--lh, 17px); }
  #scr span { display: inline-block; height: 100%; vertical-align: top; }
  #meas { position: absolute; visibility: hidden; top: -100px; letter-spacing: 0.5px; }
  #pad {
    display: none; position: fixed; bottom: 10px; right: 10px; z-index: 5;
    grid-template-columns: repeat(3, 46px); gap: 6px; opacity: .85;
  }
  #pad button {
    font: inherit; font-size: 17px; height: 44px;
    background: #1e232c; color: #c2cdda; border: 1px solid #4a5462; border-radius: 6px;
  }
  #pad button:active { background: #2b3240; }
  @media (pointer: coarse) { #pad { display: grid; } }
  #ver {
    position: fixed; bottom: 4px; left: 8px; z-index: 4;
    font-size: 10px; color: #3a4250; pointer-events: none;
  }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #7e8a9b; background: #101318; }
</style>
</head>
<body>
<div id="boot">chargement d'affut.sh…</div>
<pre id="scr"></pre>
<span id="meas">██████████</span>
<div id="ver"></div>
<div id="pad">
  <button data-k="Escape">✕</button><button data-k="ArrowUp">↑</button><button data-k="Enter">↵</button>
  <button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button>
</div>
<script type="module">
const V = '20260820n'; // incrémenté à chaque déploiement : force le navigateur à recharger le jeu
const mod = await import(`./pkg/affut.js?v=${V}`);
await mod.default({ module_or_path: `./pkg/affut_bg.wasm?v=${V}` });
if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
const w = new mod.Web();
document.getElementById('boot').remove();


const scr = document.getElementById('scr');
const meas = document.getElementById('meas');
let cols = 110, rows = 40;

// densité de la grille, ajustable avec + / − (mémorisée)
const SIZES = [[11, 14], [12, 15], [13, 17], [14, 18], [15, 19], [16, 21], [18, 23]];
let sizeIdx = Math.min(SIZES.length - 1, Math.max(0, parseInt(localStorage.getItem('affut_fs') ?? '2', 10) || 2));
let ch = 17;
function applySize() {
  const [fs, lh] = SIZES[sizeIdx];
  ch = lh;
  scr.style.fontSize = fs + 'px';
  scr.style.lineHeight = lh + 'px';
  scr.style.setProperty('--lh', lh + 'px');
  meas.style.fontSize = fs + 'px';
  localStorage.setItem('affut_fs', String(sizeIdx));
  document.getElementById('ver').textContent = 'v' + V + ' · ' + fs + 'px (+/− pour ajuster)';
}

function resize() {
  const cw = meas.getBoundingClientRect().width / 10;
  cols = Math.min(190, Math.max(70, Math.floor(window.innerWidth / cw)));
  rows = Math.min(80, Math.max(24, Math.floor(window.innerHeight / ch)));
}
function render() { scr.innerHTML = w.render(cols, rows); }

applySize();
resize();
render();
window.addEventListener('resize', () => { resize(); render(); });

setInterval(() => { w.tick(); render(); }, 500);
setInterval(() => w.save(), 10000);
window.addEventListener('beforeunload', () => w.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) w.save(); });

document.addEventListener('keydown', e => {
  if (e.metaKey) return;
  if (e.key === '+' || e.key === '=' || e.key === '-') {
    sizeIdx = Math.min(SIZES.length - 1, Math.max(0, sizeIdx + (e.key === '-' ? -1 : 1)));
    applySize(); resize(); render();
    e.preventDefault();
    return;
  }
  if (e.ctrlKey) {
    if (e.key === 's') { w.key('s', true); e.preventDefault(); }
    return;
  }
  const used = w.key(e.key, false);
  if (used && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','Enter'].includes(e.key)) {
    e.preventDefault();
  }
  if (used) render();
});

for (const b of document.querySelectorAll('#pad button')) {
  b.addEventListener('click', () => { w.key(b.dataset.k, false); render(); });
}
</script>
</body>
</html>
