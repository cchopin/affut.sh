<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>affut.sh — un comptoir de capture pour gens patients</title>
<meta name="description" content="Jeu idle de capture et de collection, façon terminal. Posez des pièges, complétez le bestiaire, laissez le temps travailler — même onglet fermé.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #14181f; color: #c2cdda;
    font-family: "Menlo", ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace;
  }
  #scr {
    font-size: 15px; line-height: 19px; white-space: pre;
    position: absolute; inset: 0; overflow: hidden;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  #meas { position: absolute; visibility: hidden; top: -100px; font-size: 15px; }
  #pad {
    display: none; position: fixed; bottom: 10px; right: 10px; z-index: 5;
    grid-template-columns: repeat(3, 46px); gap: 6px; opacity: .85;
  }
  #pad button {
    font: inherit; font-size: 17px; height: 44px;
    background: #1e232c; color: #c2cdda; border: 1px solid #4a5462; border-radius: 6px;
  }
  #pad button:active { background: #2b3240; }
  @media (pointer: coarse) { #pad { display: grid; } }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #7e8a9b; }
</style>
</head>
<body>
<div id="boot">chargement d'affut.sh…</div>
<pre id="scr"></pre>
<span id="meas">██████████</span>
<div id="pad">
  <button data-k="Escape">✕</button><button data-k="ArrowUp">↑</button><button data-k="Enter">↵</button>
  <button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button>
</div>
<script type="module">
import init, { Web } from './pkg/affut.js';

await init();
const w = new Web();
document.getElementById('boot').remove();

const scr = document.getElementById('scr');
const meas = document.getElementById('meas');
let cols = 110, rows = 40;

function resize() {
  const cw = meas.getBoundingClientRect().width / 10;
  const ch = 19;
  cols = Math.min(170, Math.max(70, Math.floor(window.innerWidth / cw)));
  rows = Math.min(72, Math.max(24, Math.floor(window.innerHeight / ch)));
}
function render() { scr.innerHTML = w.render(cols, rows); }

resize();
render();
window.addEventListener('resize', () => { resize(); render(); });

setInterval(() => { w.tick(); render(); }, 500);
setInterval(() => w.save(), 10000);
window.addEventListener('beforeunload', () => w.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) w.save(); });

document.addEventListener('keydown', e => {
  if (e.metaKey) return;
  if (e.ctrlKey) {
    if (e.key === 's') { w.key('s', true); e.preventDefault(); }
    return;
  }
  const used = w.key(e.key, false);
  if (used && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','Enter'].includes(e.key)) {
    e.preventDefault();
  }
  if (used) render();
});

for (const b of document.querySelectorAll('#pad button')) {
  b.addEventListener('click', () => { w.key(b.dataset.k, false); render(); });
}
</script>
</body>
</html>
